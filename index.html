<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K2 DEV — アプリ一覧</title>
<meta name="description" content="K2 DEV（個人開発）のアプリ。親子であそぶ季節行事アプリ「こよみっこ」シリーズ、ポモドーロで農園を育てる Pomo Land、Mac の集中アプリ ClearMind。">
<meta property="og:title" content="K2 DEV — アプリ一覧">
<meta property="og:image" content="https://kentarokentaro.github.io/assets/logo_tagline.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@K2AppDev">
<link rel="icon" href="assets/icons/otsukimi.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --cream:#FFF8E7; --ink:#2E3266; --yellow:#FFD84D; --paper:#fff; --muted:#6b6f8a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:var(--ink); font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif; line-height:1.8; }
  main { max-width:720px; margin:0 auto; padding:40px 20px 64px; }
  h1 { font-size:1.6rem; margin:0 0 4px; letter-spacing:.04em; }
  p.lead { margin:0 0 28px; color:var(--muted); font-size:.95rem; }
  .block { background:var(--paper); border-radius:24px; padding:22px; margin:0 0 18px; box-shadow:0 2px 10px rgba(46,50,102,.06); }
  .block h2 { margin:0 0 8px; font-size:1.2rem; }
  .block .sub { margin:0 0 12px; color:var(--muted); font-size:.92rem; }
  .row { display:flex; gap:14px; align-items:center; }
  .row img { width:72px; height:72px; border-radius:18px; flex:none; }
  .logo { width:min(260px,70%); height:auto; display:block; margin:4px 0 8px; }
  a.btn { display:inline-block; background:var(--yellow); color:var(--ink); text-decoration:none; font-weight:700; padding:7px 16px; border-radius:999px; }
  a.sub { margin-left:10px; color:var(--muted); font-size:.9rem; }
  .icons { display:flex; gap:8px; margin:6px 0 12px; }
  .icons img { width:44px; height:44px; border-radius:11px; }
  footer { margin-top:40px; font-size:.8rem; color:var(--muted); text-align:center; }
  footer a { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>K2 DEV</h1>
  <p class="lead">個人で作っている iPhone・Mac のアプリです。</p>

  <section class="block">
    <img class="logo" src="assets/logo.png" alt="こよみっこ">
    <h2>こよみっこ — 親子であそぶ 季節行事アプリ</h2>
    <p class="sub">こいのぼり、梅雨、七夕、夏休み、お月見。季節の行事を小さなゲームで体験する、親子向けのシリーズ。毎月ひとつ。</p>
    <div class="icons">
      <img src="assets/icons/koinobore.png" alt=""><img src="assets/icons/punimoru.png" alt=""><img src="assets/icons/tanabata.png" alt=""><img src="assets/icons/natsukappa.png" alt=""><img src="assets/icons/otsukimi.png" alt="">
    </div>
    <a class="btn" href="koyomikko/">シリーズのページへ</a>
  </section>

  <section class="block">
    <div class="row">
      <div>
        <h2>Pomo Land</h2>
        <p class="sub">ポモドーロで集中した時間が、農園を育てる。iPhone・iPad。<strong>近日公開（審査中）</strong></p>
        <a class="sub" href="https://kentarokentaro.github.io/pomoland-support/">サポート</a>
      </div>
    </div>
  </section>

  <section class="block">
    <div class="row">
      <img src="assets/icons/clearmind.png" alt="">
      <div>
        <h2>ClearMind</h2>
        <p class="sub">Mac 用の集中アプリ。</p>
        <a class="btn" href="https://apps.apple.com/jp/app/clearmind/id6758040662?mt=12">Mac App Store で見る</a>
      </div>
    </div>
  </section>

  <footer>
    <p>K2 DEV（個人開発） ・ <a href="https://x.com/K2AppDev">X（@K2AppDev）</a> ・ 各アプリのプライバシーポリシーはサポートページに掲載しています</p>
  </footer>
</main>
</body>
</html>
